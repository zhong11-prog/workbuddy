<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#FFB6C1">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>钟雁羚的工作台</title>
<style>
:root{--bg:#FFF0F5;--card-bg:#FFFFFF;--primary:#FFB6C1;--primary-light:#FFF0F5;--primary-dark:#FF85A2;--text:#4A4A4A;--text-light:#7A7A7A;--text-muted:#A0A0A0;--border:#FFD6E0;--shadow:0 2px 8px rgba(255,182,193,.15);--shadow-lg:0 6px 24px rgba(255,182,193,.25);--radius:16px;--radius-sm:10px;--sidebar-w:220px;--success:#7ECB9A;--warning:#FFB84D;--danger:#FF7B8A;--info:#FFB6C1;--transition:.2s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--primary-dark);text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--card-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;box-shadow:1px 0 8px rgba(0,0,0,.04);display:flex;flex-direction:column;transition:transform var(--transition)}
.sidebar-header{padding:24px 20px 16px;text-align:center;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:16px;color:var(--primary-dark);font-weight:700}
.sidebar-header .sub{font-size:11px;color:var(--text-muted)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);font-size:14px;color:var(--text);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item .icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.page{display:none;padding:28px 32px;flex:1}
.page.active{display:block}
.page-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow var(--transition)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all var(--transition);font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FFB6C1,#FF85A2);color:#fff}.btn-primary:hover{background:linear-gradient(135deg,#FF85A2,#FF6B8A);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.96)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:14px}
.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}
.btn-block{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card-bg);cursor:pointer;transition:all var(--transition);font-family:inherit;font-size:14px;font-weight:600;width:100%}
.btn-block:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-2px)}
.btn-block .big-icon{font-size:36px}
.input,.select,.textarea{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--card-bg);transition:border-color var(--transition);width:100%}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary)}
.textarea{resize:vertical;min-height:60px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.tag-primary{background:var(--primary-light);color:var(--primary-dark)}.tag-yellow{background:#FFF3E0;color:#E65100}
.tag-green{background:#E8F5E9;color:#2E7D32}.tag-pink{background:#FFF0F5;color:#D6336C}.tag-red{background:#FFEBEE;color:#C62828}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:5px}
.form-row{display:flex;gap:10px}.form-row>*{flex:1}
.toast{position:fixed;top:20px;right:20px;z-index:9999;background:var(--card-bg);padding:12px 20px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s ease;border-left:3px solid var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.modal{background:var(--card-bg);border-radius:var(--radius);padding:24px;max-width:500px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--primary-dark)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:18px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);transition:all var(--transition);cursor:pointer}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-value{font-size:32px;font-weight:700;color:var(--primary-dark)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px}
.progress-bar{height:8px;background:var(--primary-light);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#FFB6C1,#FF85A2);border-radius:4px;transition:width .5s}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-weight:600;color:var(--text-light);border-bottom:2px solid var(--border);font-size:11px}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
.checkbox-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox-wrap input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid var(--border);border-radius:50%;cursor:pointer;transition:all .2s;flex-shrink:0}
.checkbox-wrap input[type=checkbox]:checked{background:var(--success);border-color:var(--success)}
.checkbox-wrap input[type=checkbox]:checked::after{content:'✓';color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}.empty-state .icon{font-size:48px;margin-bottom:12px}
.fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.level-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.level-tab{padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--card-bg);transition:all var(--transition);font-family:inherit}
.level-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.study-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.study-tab{padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--card-bg);transition:all var(--transition);font-family:inherit}
.study-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grammar-card{background:var(--card-bg);border-radius:var(--radius);padding:18px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.grammar-card .g-title{font-size:18px;font-weight:700;color:var(--primary-dark)}
.grammar-card .g-explain{font-size:14px;color:var(--text);margin:8px 0}
.grammar-card .g-example{background:var(--bg);padding:10px 14px;border-radius:var(--radius-sm);margin:6px 0;font-size:14px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.book-card{background:var(--card-bg);border-radius:var(--radius);padding:12px;border:1px solid var(--border);transition:all var(--transition);cursor:pointer;text-align:center}
.book-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.book-cover-img{width:100%;margin-bottom:10px;border-radius:var(--radius-sm);overflow:hidden}
.book-cover-img svg{width:100%;height:auto;display:block;min-height:140px}
.book-status{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:6px}
.book-status.want{background:#FFF0F5;color:#D6336C}.book-status.reading{background:#FFF3E0;color:#E65100}.book-status.done{background:#E8F5E9;color:#2E7D32}
.timer-circle{width:180px;height:180px;border-radius:50%;border:6px solid var(--primary-light);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:var(--card-bg);box-shadow:0 0 40px rgba(255,182,193,.2)}
.timer-display{font-size:42px;font-weight:700;color:var(--primary-dark);font-variant-numeric:tabular-nums}
.note-float-btn{position:fixed;bottom:190px;right:24px;z-index:999;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FFB6C1,#FF85A2);color:#fff;font-size:20px;border:none;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.note-float-btn:hover{transform:scale(1.1)}
.note-float-panel{position:fixed;bottom:180px;right:80px;z-index:999;width:280px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;display:none}
.note-float-panel.show{display:block;animation:slideIn .3s ease}
/* Cat SVG */
.cat-container{position:fixed;bottom:20px;right:20px;z-index:1000;cursor:pointer;transition:transform .3s;filter:drop-shadow(0 4px 16px rgba(255,182,193,.3))}
.cat-container:hover{transform:scale(1.08)}
.cat-container svg{width:130px;height:140px}
.cat-bubble{position:fixed;background:var(--card-bg);padding:8px 14px;border-radius:16px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border);z-index:1001;max-width:200px}
.cat-bubble.show{opacity:1}
.cat-bubble.above::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--card-bg);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.cat-bubble.below::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--card-bg);border-left:1px solid var(--border);border-top:1px solid var(--border)}
/* Speaker animation */
.speaker-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--primary);background:var(--card-bg);cursor:pointer;font-size:14px;transition:all .2s;margin-left:8px;flex-shrink:0}
.speaker-btn:hover{background:var(--primary-light)}
.speaker-btn.playing{background:var(--primary);color:#fff;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* Dictation area */
.dictation-box{background:var(--bg);border:2px dashed var(--border);border-radius:var(--radius);padding:20px;margin-top:16px}
.dictation-score{font-size:13px;color:var(--primary-dark);font-weight:600;text-align:center;margin-bottom:8px}
/* Korean keyboard */
.kr-keyboard{display:none;background:var(--bg);border-radius:var(--radius-sm);padding:8px;margin-top:8px;border:1px solid var(--border)}
.kr-keyboard.show{display:block}
.kr-key-row{display:flex;gap:3px;margin-bottom:3px;justify-content:center}
.kr-key{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:15px;font-family:inherit;min-width:32px;text-align:center;transition:all .15s}
.kr-key:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.hearts{position:absolute;bottom:80%;left:50%;pointer-events:none;z-index:1002;transform:translateX(-50%)}
.heart-p{position:absolute;font-size:16px;animation:floatUp 1.5s ease-out forwards;opacity:0}
@keyframes floatUp{0%{transform:translateY(0)scale(.5);opacity:1}100%{transform:translateY(-60px)scale(1.3);opacity:0}}
.confetti{position:fixed;z-index:10000;font-size:20px;animation:confettiFall 2.5s ease-out forwards;pointer-events:none}
@keyframes confettiFall{0%{transform:translateY(-10px)rotate(0);opacity:1}100%{transform:translateY(100vh)rotate(720deg);opacity:0}}
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mood-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:var(--bg)}.mood-cell.today{border:2px solid var(--primary)}
.period-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.period-day{padding:8px 2px;border-radius:50%;font-size:12px;text-align:center}.period-day.normal{background:var(--bg)}.period-day.period{background:#fee2e2;color:#991b1b;font-weight:600}.period-day.ovulation{background:#FFF0F5;color:#D6336C;font-weight:600}.period-day.predicted{background:#fef3c7;color:#92400e;border:1px dashed #f59e0b}.period-day.today{border:2px solid var(--primary)}
.sound-grid{display:flex;gap:8px;flex-wrap:wrap}
.sound-btn{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:12px;font-family:inherit}.sound-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.task-detail-row{cursor:pointer;padding:8px 12px;margin:4px 0;border-radius:8px;transition:background .2s;display:flex;align-items:center;gap:8px;font-size:13px}
.task-detail-row:hover{background:var(--primary-light)}
.task-expand{display:none;padding:8px 12px 8px 36px;font-size:12px;color:var(--text-light);border-bottom:1px solid var(--border)}
.task-expand.show{display:block}
@media(max-width:480px){.page{padding:12px}.dash-grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat-card{padding:12px}.card{padding:12px}.sidebar{width:260px}.book-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.page-title{font-size:18px}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);width:260px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.page{padding:16px}.menu-toggle{display:flex!important;position:fixed;top:12px;left:12px;z-index:200;width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:18px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow)}.cat-container{bottom:16px;right:8px;transform:scale(.7)}.note-float-btn{bottom:160px;right:8px}.dash-grid{grid-template-columns:repeat(2,1fr)}.detail-panel{width:100vw}.reader-dual{flex-direction:column}.reader-dual>*{width:100%!important}}
@media(min-width:769px){.menu-toggle{display:none}}
@media(min-width:1024px){.dash-grid{grid-template-columns:repeat(4,1fr)}}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:90vw;background:var(--card-bg);z-index:500;box-shadow:-4px 0 30px rgba(0,0,0,.1);transform:translateX(100%);transition:transform .3s;overflow-y:auto;padding:24px}
.detail-panel.show{transform:translateX(0)}
.detail-panel .close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;font-size:16px;color:var(--text-light)}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:499;display:none}
.detail-overlay.show{display:block}
/* Reader dual column */
.reader-dual{display:flex;gap:20px;align-items:flex-start}
.reader-dual .reader-left{flex:1;min-width:0}
.reader-dual .reader-right{width:340px;flex-shrink:0;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
/* Flip card */
.kc-inner.flipped{transform:rotateY(180deg)!important}
/* Cat drag */
.cat-container.dragging{cursor:grabbing;opacity:.85}
.cat-container.dragging *{transition:none!important}
/* Period click */
.period-day:not(.normal):hover{transform:scale(1.2);z-index:1}
/* Match3 */
.match3-wrap{position:relative;max-width:480px;margin:0 auto}
.match3-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px 16px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-radius:var(--radius);border:1px solid var(--border)}
.match3-info{text-align:center}
.match3-info .val{font-size:24px;font-weight:700;color:var(--primary-dark)}
.match3-info .lbl{font-size:10px;color:var(--text-muted)}
.m3-grid{display:grid;gap:3px;background:var(--border);padding:4px;border-radius:var(--radius);margin:0 auto;touch-action:none}
.m3-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border-radius:6px;cursor:pointer;font-size:28px;transition:all .15s;user-select:none;position:relative}
.m3-cell:hover{transform:scale(1.05)}
.m3-cell.selected{transform:scale(1.12);box-shadow:0 0 12px rgba(255,182,193,.5);z-index:1}
.m3-cell.matched{animation:m3Pop .3s ease-out}
@keyframes m3Pop{0%{transform:scale(1)}50%{transform:scale(1.3);opacity:.7}100%{transform:scale(0);opacity:0}}
.m3-cell.drop{animation:m3Drop .3s ease-out}
@keyframes m3Drop{0%{transform:translateY(-50px)}100%{transform:translateY(0)}}
.m3-bar-wrap{height:8px;background:var(--primary-light);border-radius:4px;margin-top:8px;overflow:hidden}
.m3-bar-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF9AAF);border-radius:4px;transition:width .5s}
.m3-level-bg{position:absolute;inset:0;opacity:.06;pointer-events:none;font-size:80px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--primary)}
.m3-level-select{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:500px;margin:0 auto}
.m3-lv-btn{aspect-ratio:1;border-radius:var(--radius);border:2px solid var(--border);background:var(--card-bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s;font-family:inherit;font-size:18px;font-weight:700}
.m3-lv-btn:hover{border-color:var(--primary);transform:scale(1.05)}
.m3-lv-btn.unlocked{background:var(--primary-light);border-color:var(--primary)}
.m3-lv-btn.completed{background:var(--success);border-color:var(--success);color:#fff}
.m3-lv-btn.locked{opacity:.4;cursor:not-allowed}.m3-lv-btn .stars{font-size:11px;margin-top:2px}
/* Calendar & History */
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;position:relative}
.cal-cell:hover{background:var(--primary-light)}
.cal-cell.other-month{color:var(--text-muted);opacity:.4}
.cal-cell.today{border:2px solid var(--primary);font-weight:700}
.cal-cell.has-data{background:var(--primary-light)}
.cal-cell.has-data::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
.cal-cell.selected{background:var(--primary);color:#fff}
.cal-header{text-align:center;font-size:11px;color:var(--text-muted);padding:2px}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.cal-nav button{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;font-size:14px;font-family:inherit}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heatmap-cell{aspect-ratio:1;border-radius:4px;background:var(--bg);transition:all .2s}
.heatmap-cell.l1{background:#FFE0E6}.heatmap-cell.l2{background:#FFC8D5}.heatmap-cell.l3{background:#FFB3C1}.heatmap-cell.l4{background:#FF85A2}
.history-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.history-bar input,.history-bar select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--card-bg)}
.game-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:10px 16px;background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);flex-wrap:wrap}
.game-bar .back-btn{cursor:pointer;color:var(--primary-dark);font-size:14px;font-weight:600;padding:4px 10px;border-radius:var(--radius-sm);transition:background .2s}
.game-bar .back-btn:hover{background:var(--primary-light)}
/* Swim expanded */
.card.expanded .swim-detail{display:block!important}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">

<script>
const isLocal=window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1';
const API=isLocal?'':'https://workbuddy-production-706a.up.railway.app',today=()=>new Date().toISOString().split('T')[0];
const PAGES=[
  {id:'dashboard',icon:'🏠',label:'首页仪表盘'},{id:'tasks',icon:'📋',label:'今日计划'},
  {id:'finance',icon:'💰',label:'智能记账'},{id:'fitness',icon:'🏃',label:'健身'},
  {id:'korean',icon:'🇰🇷',label:'韩语陪考'},{id:'reading',icon:'📚',label:'电子阅读'},
  {id:'menu',icon:'🍜',label:'随机菜单'},{id:'recipes',icon:'👩‍🍳',label:'家常菜谱'},
  {id:'shopping',icon:'🛒',label:'待购清单'},{id:'health',icon:'💪',label:'健康打卡'},
  {id:'period',icon:'📅',label:'经期记录'},{id:'mood',icon:'💝',label:'心情日记'},
  {id:'pomodoro',icon:'🍅',label:'番茄专注'},{id:'notes',icon:'💡',label:'灵感便签'},
  {id:'swim',icon:'🏊',label:'游泳'},
];
let currentPage='dashboard',sidebarOpen=false;

function renderNav(){document.getElementById('sidebarNav').innerHTML=PAGES.map(p=>`<button class="nav-item${p.id===currentPage?' active':''}" onclick="navigate('${p.id}')"><span class="icon">${p.icon}</span><span>${p.label}</span></button>`).join('')}
function navigate(id){currentPage=id;renderNav();loadPage(id);if(window.innerWidth<=768)toggleSidebar(false)}
function toggleSidebar(f){sidebarOpen=f!==undefined?f:!sidebarOpen;document.getElementById('sidebar').classList.toggle('open',sidebarOpen)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2500)}
function closeDetail(){document.getElementById('detailPanel').classList.remove('show');document.getElementById('detailOverlay').classList.remove('show')}
function openDetail(html){document.getElementById('detailContent').innerHTML=html;document.getElementById('detailPanel').classList.add('show');document.getElementById('detailOverlay').classList.add('show')}
// Custom confirm dialog (replaces blocked confirm())
function showConfirm(msg,onYes){
  var o=document.createElement('div');o.className='modal-overlay';o.id='confirmModal';
  o.innerHTML='<div class="modal" style="max-width:320px;text-align:center"><p style="font-size:15px;margin-bottom:16px">'+msg+'</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-outline btn-sm" onclick="document.getElementById(\'confirmModal\').remove()">取消</button><button class="btn btn-danger btn-sm" id="confirmYesBtn">确认删除</button></div></div>';
  o.addEventListener('click',function(e){if(e.target===o)o.remove()});document.body.appendChild(o);
  document.getElementById('confirmYesBtn').onclick=function(){o.remove();onYes()}
}

// Cat
let catTimer,catSleep=false;
function positionBubble(msg,duration){
  var b=document.getElementById('catBubble'),cat=document.getElementById('catContainer');
  var cr=cat.getBoundingClientRect(),bw=180,bh=50;
  b.textContent=msg;b.classList.remove('above','below');
  // Default: above cat
  var top=cr.top-bh-8,left=cr.left+cr.width/2-bw/2;
  var arrow='above';
  // If too close to top edge, show below
  if(top<10){top=cr.bottom+8;arrow='below'}
  // Keep within horizontal bounds
  if(left<10)left=10;
  if(left+bw>window.innerWidth-10)left=window.innerWidth-bw-10;
  b.style.top=top+'px';b.style.left=left+'px';
  b.classList.add(arrow,'show');
  setTimeout(function(){b.classList.remove('show','above','below')},duration||2500);
}
function catAct(a){
  clearTimeout(catTimer);
  if(catSleep){document.getElementById('sleepEyes').style.display='none';catSleep=false}
  switch(a){
    case'happy':spawnHearts();break;
    case'talk':positionBubble(['加油哦~','你真棒！','喵~','好厉害！'][Math.floor(Math.random()*4)],2500);break;
    case'greet':var h=new Date().getHours(),g;if(h<6)g='夜深了，早点休息~';else if(h<9)g='早安呀！☀️';else if(h<12)g='上午好！';else if(h<14)g='中午好！记得吃饭🍱';else if(h<18)g='下午好！加油~';else if(h<22)g='晚上好！辛苦了🌙';else g='晚安！💤';positionBubble(g,3000);break;
  }resetCatTimer()
}
function resetCatTimer(){clearTimeout(catTimer);catTimer=setTimeout(()=>{document.getElementById('sleepEyes').style.display='block';catSleep=true;positionBubble('zzZ...💤',2000)},60000)}
function spawnHearts(){const c=document.getElementById('heartsContainer');for(let i=0;i<5;i++){const h=document.createElement('span');h.className='heart-p';h.textContent=['❤️','💕','💖','✨','🌟'][i];h.style.left=(Math.random()*60-30)+'px';h.style.animationDelay=(i*.15)+'s';c.appendChild(h);setTimeout(()=>h.remove(),2000)}}
function spawnConfetti(){for(let i=0;i<20;i++){const p=document.createElement('div');p.className='confetti';p.textContent=['🌸','🎉','✨','🌟','💫','🎊','💐'][i%7];p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.5+'s';p.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),4000)}}
// Cat drag + click
let catDragging=false,catStartX,catStartY,catOrigX,catOrigY;
const catEl=document.getElementById('catContainer');
catEl.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  catDragging=true;catEl.classList.add('dragging');
  const rect=catEl.getBoundingClientRect();
  catStartX=e.clientX;catStartY=e.clientY;
  catOrigX=rect.left;catOrigY=rect.top;
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!catDragging)return;
  const dx=e.clientX-catStartX,dy=e.clientY-catStartY;
  catEl.style.left=(catOrigX+dx)+'px';catEl.style.top=(catOrigY+dy)+'px';
  catEl.style.right='auto';catEl.style.bottom='auto';
});
document.addEventListener('mouseup',e=>{
  if(!catDragging){catDragging=false;return}
  const dx=Math.abs(e.clientX-catStartX),dy=Math.abs(e.clientY-catStartY);
  catEl.classList.remove('dragging');catDragging=false;
  if(dx<5&&dy<5){// Was a click, not drag
    positionBubble(['呼噜呼噜~','喵呜~','咕噜咕噜~','再摸就撒娇啦！'][Math.floor(Math.random()*4)],2500);spawnHearts();
    if(catSleep){document.getElementById('sleepEyes').style.display='none';catSleep=false}resetCatTimer()
  }
});
// Touch support
catEl.addEventListener('touchstart',e=>{
  catDragging=true;const t=e.touches[0];
  const rect=catEl.getBoundingClientRect();
  catStartX=t.clientX;catStartY=t.clientY;catOrigX=rect.left;catOrigY=rect.top;
});
document.addEventListener('touchmove',e=>{
  if(!catDragging)return;
  const t=e.touches[0],dx=t.clientX-catStartX,dy=t.clientY-catStartY;
  catEl.style.left=(catOrigX+dx)+'px';catEl.style.top=(catOrigY+dy)+'px';
  catEl.style.right='auto';catEl.style.bottom='auto';
});
document.addEventListener('touchend',()=>{catDragging=false});

setTimeout(()=>catAct('greet'),2000);resetCatTimer();

function loadPage(id){
  document.getElementById('mainContent').innerHTML=`<div style="text-align:center;padding:60px;color:var(--text-muted)"><div style="font-size:40px">🐱</div><p>加载中...</p></div>`;
  setTimeout(()=>{const fns={dashboard:renderDashboard,tasks:renderTasks,finance:renderFinance,fitness:renderFitness,korean:renderKorean,reading:renderReading,menu:renderMenu,recipes:renderRecipes,shopping:renderShopping,health:renderHealth,period:renderPeriod,mood:renderMood,pomodoro:renderPomodoro,notes:renderNotes,swim:renderSwim};if(fns[id])fns[id]();else renderDashboard()},100)
}

// ========== DASHBOARD ==========
// ===== 共享日历组件 =====
function renderCalendar(year,month,dataMap,onClick){
  var d=new Date(year,month-1,1);var startDay=d.getDay();var daysInMonth=new Date(year,month,0).getDate();
  var daysInPrev=new Date(year,month-1,0).getDate();var todayStr=today();var h='';
  h+='<div class="cal-nav"><button onclick="'+onClick.replace('{y}',(month===1?year-1:year)).replace('{m}',(month===1?12:month-1))+'">◀</button>';
  h+='<span style="font-weight:600">'+year+'年'+month+'月</span>';
  h+='<button onclick="'+onClick.replace('{y}',(month===12?year+1:year)).replace('{m}',(month===12?1:month+1))+'">▶</button></div>';
  h+='<div class="cal-month"><div class="cal-header">日</div><div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div><div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div>';
  for(var i=startDay-1;i>=0;i--){h+='<div class="cal-cell other-month">'+(daysInPrev-i)+'</div>'}
  for(var i=1;i<=daysInMonth;i++){
    var dateStr=year+'-'+String(month).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    var cls='cal-cell';if(dateStr===todayStr)cls+=' today';if(dataMap&&dataMap[dateStr])cls+=' has-data';
    h+='<div class="'+cls+'" onclick="'+onClick.replace('{y}',year).replace('{m}',String(month).padStart(2,'0')).replace('{d}',String(i).padStart(2,'0'))+'">'+i+'</div>'
  }
  var remaining=42-(startDay+daysInMonth);for(var i=1;i<=remaining;i++){h+='<div class="cal-cell other-month">'+i+'</div>'}
  h+='</div>';return h
}

function renderHeatmap(month,data,totalHabits){
  var d=new Date(month+'-01');var startDay=d.getDay();var days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  var h='<div class="heatmap-grid">';
  for(var i=0;i<startDay;i++)h+='<div class="heatmap-cell"></div>';
  for(var i=1;i<=days;i++){
    var dateStr=month+'-'+String(i).padStart(2,'0');
    var cnt=data&&data[dateStr]?data[dateStr].length:0;
    var lv=cnt===0?'':'l'+Math.min(4,Math.ceil(cnt/totalHabits*4));
    var label=data&&data[dateStr]?cnt+'/'+totalHabits:'';
    h+='<div class="heatmap-cell '+lv+'" title="'+dateStr+' '+label+'"></div>'
  }
  h+='</div>';return h
}

let _moodCalYear=null,_moodCalMonth=null;
function renderMoodCal(year,month){
  _moodCalYear=year;_moodCalMonth=month;
  fetch(API+'/api/mood/calendar?month='+year+'-'+String(month).padStart(2,'0')).then(function(r){return r.json()}).then(function(d){
    var h=renderCalendar(year,month,d.moods,
      'renderMoodCal({y},{m});showMoodDay(\'{y}-{m}-{d}\')');
    document.getElementById('moodCal').innerHTML=h
  })
}
function showMoodDay(date){
  fetch(API+'/api/mood?date='+date).then(function(r){return r.json()}).then(function(d){
    var mood=d.length>0?d[0]:null;
    var h='<h4>'+date+'</h4>';
    if(mood)h+='<p>'+mood.emoji+' '+mood.mood+'</p><p style="color:var(--text-light);font-size:13px">'+(mood.note||'')+'</p>';
    else h+='<p style="color:var(--text-muted)">这天没有记录</p>';
    h+='<button class="btn btn-sm btn-outline" onclick="closeDetail()">关闭</button>';
    openDetail(h)
  })
}
async function renderDashboard(){
  const m=document.getElementById('mainContent');
  try{
    const r=await fetch(API+'/api/dashboard');const d=await r.json();
    let ex='';if(d.examCountdown&&d.examCountdown.days>0)ex=`<div class="stat-card" style="border-color:${d.examCountdown.days<=30?'var(--danger)':'var(--warning)'};cursor:pointer" onclick="navigate('korean')"><div class="stat-value" style="color:${d.examCountdown.days<=30?'var(--danger)':'var(--warning)'}">📅 ${d.examCountdown.days}天</div><div class="stat-label">${d.examCountdown.name} Lv.${d.examCountdown.targetLevel}</div></div>`;
    let pr='';if(d.periodPrediction){const p=d.periodPrediction;pr=`<div class="stat-card" onclick="navigate('period')"><div class="stat-value" style="font-size:24px">${p.daysUntil<=5?'🔴':p.daysUntil<=7?'🟡':'🟢'} ${p.daysUntil>0?'约'+p.daysUntil+'天':'预计今天'}</div><div class="stat-label">预测 ${p.nextPredicted}</div></div>`}
    m.innerHTML=`<div class="fade-in"><div class="page-title"><span>🏠</span> 首页仪表盘</div>
      <div class="dash-grid">
        <div class="stat-card" onclick="openTaskDetail()"><div class="stat-value">${d.taskCount.done||0}/${d.taskCount.total}</div><div class="stat-label">📋 今日待办 (点击查看)</div><div class="progress-bar"><div class="progress-fill" style="width:${d.taskCount.total>0?Math.round((d.taskCount.done||0)/d.taskCount.total*100):0}%"></div></div></div>
        <div class="stat-card" onclick="openFinanceDetail()"><div class="stat-value" style="color:var(--success)">¥${d.financeSummary.expense.toFixed(0)}</div><div class="stat-label">💰 今日支出 (点击查看)</div></div>
        <div class="stat-card" onclick="navigate('health')"><div class="stat-value">${d.streak}天</div><div class="stat-label">💪 连续打卡</div></div>${ex}${pr}
      </div>
      <div class="card" style="background:linear-gradient(135deg,#FFF0F5,#F5E6F0)"><div class="card-title">🇰🇷 오늘의 한마디</div>
        <p style="font-size:18px;line-height:1.6;color:var(--primary-dark);text-align:center;padding:10px 10px 4px" id="dqKo"></p>
        <p style="font-size:14px;text-align:center;color:var(--text-light);padding-bottom:8px" id="dqCn"></p>
      </div>
      </div>
      <div class="card" id="networkCard"><div class="card-title">🌐 访问地址</div><div id="networkInfo" style="font-size:12px;color:var(--text-light)">加载中...</div></div>
      <div class="card"><div class="card-title">🍽️ 今日推荐菜单 <span style="font-size:11px;color:var(--text-muted);font-weight:400;cursor:pointer" onclick="navigate('menu')">管理菜单 →</span></div><div id="dashMenu">加载中...</div></div>
      <div class="card" style="cursor:pointer" onclick="openTaskDetail()"><div class="card-title">📋 今日待办 <span style="font-size:11px;color:var(--text-muted);font-weight:400">点击查看详情</span></div><div id="dashTasks">加载中...</div></div>
    </div>`;
    // 每日推荐菜单
    fetch(API+'/api/daily-menu').then(function(r){return r.json()}).then(function(dm){
      var el=document.getElementById('dashMenu');if(!el)return;var h='';
      var meals=[['breakfast','🌅 早餐'],['lunch','☀️ 午餐'],['dinner','🌙 晚餐']];
      meals.forEach(function(m){
        var item=dm[m[0]];
        if(item){
          h+='<div style="flex:1;text-align:center;padding:8px 4px;cursor:pointer" onclick="navigate(\'recipes\');setTimeout(function(){viewRecipe('+item.id+')},500)"><div style="font-size:11px;color:var(--text-muted)">'+m[1]+'</div><div style="font-size:14px;font-weight:600;color:var(--primary-dark);margin-top:4px">'+item.name+'</div><div style="font-size:10px;color:var(--text-muted)">'+(item.category||'家常')+'</div></div>';
        } else {
          h+='<div style="flex:1;text-align:center;padding:8px 4px"><div style="font-size:11px;color:var(--text-muted)">'+m[1]+'</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px">-</div></div>';
        }
      });
      el.innerHTML='<div style="display:flex;gap:8px">'+h+'</div>';
    }).catch(function(){var el=document.getElementById('dashMenu');if(el)el.innerHTML='<p style="color:var(--text-muted);font-size:12px">菜单加载失败</p>'});
    setTimeout(()=>{
      const q=d.quote.text,p=q.split('—'),ko=p[0].trim(),cn=p[1]?p[1].trim():'';
      const elKo=document.getElementById('dqKo'),elCn=document.getElementById('dqCn');
      if(elKo)elKo.textContent=ko;
      if(elCn)elCn.textContent=cn||'(试着翻译一下吧~)';
    },50);
    // Network info

async function renderTasks(){

async function loadTasks(){
  const d=document.getElementById('taskDate')?.value||today();const r=await fetch(API+'/api/tasks?date='+d);const ts=await r.json();const el=document.getElementById('taskList');if(!el)return;
  if(ts.length===0){el.innerHTML='<div class="empty-state"><div class="icon">📝</div><p>没有待办</p></div>';return}
  el.innerHTML=ts.map(t=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="task-detail-row" onclick="this.nextElementSibling?.classList.toggle(\'show\')"><label class="checkbox-wrap" onclick="event.stopPropagation()"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask(${t.id},this.checked)"></label><span style="flex:1;font-size:14px;${t.completed?'text-decoration:line-through;color:var(--text-muted)':''}">${t.title}</span><span class="tag ${t.priority==='high'?'tag-red':t.priority==='low'?'tag-green':'tag-yellow'}">${t.priority==='high'?'高':t.priority==='low'?'低':'中'}</span>${t.time_slot?`<span class="tag tag-pink">${t.time_slot==='morning'?'上午':t.time_slot==='afternoon'?'下午':t.time_slot==='evening'?'傍晚':'晚上'}</span>`:''}<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();editTask(${t.id})">编辑</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteTask(${t.id})">删除</button></div><div class="task-expand">${t.description?`<div>📝 ${t.description}</div>`:'<div style="color:var(--text-muted)">暂无备注</div>'}<div style="margin-top:4px">🕐 创建于 ${t.created_at||'--'}</div></div></div>`).join('')}
async function toggleTask(id,c){await fetch(API+'/api/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:c?1:0})});if(c){catAct('happy');spawnConfetti();toast('完成！🎉')}loadTasks()}
function showAddTask(t){
  const is=!!t;const o=document.createElement('div');o.className='modal-overlay';
  o.innerHTML=`<div class="modal"><div class="modal-title">${is?'编辑':'添加'}任务</div>
    <div class="form-group"><label>标题</label><input class="input" id="taTitle" value="${is?t.title:''}"></div>
    <div class="form-row"><div class="form-group"><label>优先级</label><select class="select" id="taPri"><option value="high" ${is&&t.priority==='high'?'selected':''}>🔴 高</option><option value="medium" ${is&&t.priority==='medium'?'selected':''} selected>🟡 中</option><option value="low" ${is&&t.priority==='low'?'selected':''}>🟢 低</option></select></div><div class="form-group"><label>时段</label><select class="select" id="taSlot"><option value="">全天</option><option value="morning" ${is&&t.time_slot==='morning'?'selected':''}>🌅 上午</option><option value="afternoon" ${is&&t.time_slot==='afternoon'?'selected':''}>☀️ 下午</option><option value="evening" ${is&&t.time_slot==='evening'?'selected':''}>🌆 傍晚</option><option value="night" ${is&&t.time_slot==='night'?'selected':''}>🌙 晚上</option></select></div></div>
    <div class="form-group"><label>备注</label><textarea class="textarea" id="taDesc">${is?t.description||'':''}</textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary btn-sm" onclick="saveTask(${is?t.id:0})">保存</button></div></div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
async function saveTask(id){const ti=document.getElementById('taTitle').value.trim();if(!ti)return toast('请输入标题');const d={title:ti,description:document.getElementById('taDesc').value,priority:document.getElementById('taPri').value,time_slot:document.getElementById('taSlot').value,date:document.getElementById('taskDate')?.value||today()};if(id)await fetch(API+'/api/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});else await fetch(API+'/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('.modal-overlay')?.remove();catAct('talk');loadTasks()}
async function editTask(id){const d=document.getElementById('taskDate')?.value||today();const r=await fetch(API+'/api/tasks?date='+d);const ts=await r.json();const t=ts.find(x=>x.id===id);if(t)showAddTask(t)}
async function deleteTask(id){showConfirm('确定删除这个任务吗？',async()=>{await fetch(API+'/api/tasks/'+id,{method:'DELETE'});loadTasks()})}

// TTS Speaker
let ttsSpeaking=false;
function speakKorean(word,btn){
  if(!('speechSynthesis' in window)){toast('请使用Chrome等现代浏览器播放发音');return}
  if(ttsSpeaking){window.speechSynthesis.cancel();ttsSpeaking=false;if(btn)btn.classList.remove('playing');return}
  var u=new SpeechSynthesisUtterance(word);u.lang='ko-KR';u.rate=0.8;u.pitch=1;
  u.onstart=function(){ttsSpeaking=true;if(btn)btn.classList.add('playing')};
  u.onend=function(){ttsSpeaking=false;if(btn)btn.classList.remove('playing')};
  u.onerror=function(){ttsSpeaking=false;if(btn)btn.classList.remove('playing');toast('发音播放失败')};
  window.speechSynthesis.speak(u)
}

  var reader=new FileReader();reader.onload=async function(){

function loadShopCats(){fetch(API+'/api/shopping/categories').then(r=>r.json()).then(d=>{var el=document.getElementById('shCats'),cat=shCatSel||'全部';if(!el)return;var all=d.defaults.concat(d.custom);el.innerHTML='<button class="btn btn-sm '+(cat==='全部'?'btn-primary':'btn-outline')+'" style="font-size:11px;padding:4px 10px" onclick="shCatSel=\'全部\';loadShop();loadShopCats()">全部</button>'+all.map(c=>'<button class="btn btn-sm '+(cat===c?'btn-primary':'btn-outline')+'" style="font-size:11px;padding:4px 10px" onclick="shCatSel=\''+c+'\';loadShop();loadShopCats()">'+c+'</button>').join('')})}
function showAddShop(){const o=document.createElement('div');o.className='modal-overlay';fetch(API+'/api/shopping/categories').then(r=>r.json()).then(d=>{var cats=d.defaults.concat(d.custom);o.innerHTML=`<div class="modal"><div class="modal-title">添加物品</div><div class="form-group"><label>名称</label><input class="input" id="shName"></div><div class="form-row"><div class="form-group"><label>分类</label><select class="select" id="shCat"><option value="">选择分类</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><input class="input" id="shCatNew" placeholder="或输入新分类" style="font-size:11px;margin-top:6px"></div><div class="form-group"><label>优先级</label><select class="select" id="shPri"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary btn-sm" onclick="saveShop()">添加</button></div></div>`;o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)})}
async function saveShop(){const n=document.getElementById('shName').value.trim();if(!n)return toast('请输入名称');const cat=document.getElementById('shCatNew')?.value?.trim()||document.getElementById('shCat')?.value||'其他';await fetch(API+'/api/shopping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,category:cat,priority:document.getElementById('shPri').value})});document.querySelector('.modal-overlay')?.remove();loadShop();loadShopCats()}

  var m=document.getElementById('mainContent');
  m.innerHTML='<div class="fade-in"><div class="page-title">💪 健康打卡</div><div class="card"><div><span class="card-title">🔥 打卡热力图</span><select id="hhMonth" onchange="loadHHeatmap()" style="margin-left:8px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">'+

    '<div class="card"><div class="card-title">📋 今日打卡 <span style="font-size:11px;color:var(--text-muted);font-weight:400">每天0点自动重置</span></div><div id="hhList">加载中...</div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="showAddHabit()">+ 添加</button></div></div>';

async function loadHealth(){const[hr,cr,ar]=await Promise.all([fetch(API+'/api/health/habits'),fetch(API+'/api/health/checkins?date='+today()),fetch(API+'/api/health/checkins')]);const hs=await hr.json(),cs=await cr.json(),ac=await ar.json();const ci=new Set(cs.map(c=>c.habit_id));const el=document.getElementById('hhList');if(!el)return;if(hs.length===0){el.innerHTML='<div class="empty-state"><div class="icon">💪</div><p>还没有习惯</p></div>';return}const sm={};hs.forEach(h=>{let s=0,d=new Date(today());while(true){const ds=d.toISOString().split('T')[0];if(ac.some(c=>c.habit_id===h.id&&c.date===ds)){s++;d.setDate(d.getDate()-1)}else break}sm[h.id]=s});el.innerHTML=hs.map(h=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:24px">${h.icon}</span><span style="flex:1;font-size:14px">${h.name}</span><span style="font-size:12px;color:var(--primary-dark);font-weight:600">🔥 ${sm[h.id]}天</span><button class="btn btn-sm ${ci.has(h.id)?'btn-success':'btn-outline'}" onclick="toggleCheckin(${h.id},${!ci.has(h.id)})">${ci.has(h.id)?'✅ 已打卡':'打卡'}</button><button class="btn btn-sm btn-danger" onclick="delHabit(${h.id})">删除</button></div>`).join('')}
async function toggleCheckin(hid,ch){if(ch){await fetch(API+'/api/health/checkins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({habit_id:hid,date:today()})});catAct('happy');spawnHearts();toast('打卡成功！')}else await fetch(API+'/api/health/checkins',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({habit_id:hid,date:today()})});loadHealth()}
function showAddHabit(){const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal"><div class="modal-title">添加习惯</div><div class="form-row"><div class="form-group"><label>图标</label><input class="input" id="hbIcon" value="✅"></div><div class="form-group"><label>名称</label><input class="input" id="hbName" placeholder="如：喝水8杯"></div></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary btn-sm" onclick="saveHabit()">添加</button></div></div>`;o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
async function saveHabit(){const n=document.getElementById('hbName').value.trim();if(!n)return toast('请输入名称');await fetch(API+'/api/health/habits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,icon:document.getElementById('hbIcon').value||'✅'})});document.querySelector('.modal-overlay')?.remove();loadHealth()}
async function delHabit(id){showConfirm('确定删除这个打卡习惯吗？历史记录也会清除。',async()=>{await fetch(API+'/api/health/habits/'+id,{method:'DELETE'});loadHealth()})}

// ========== PERIOD ==========
async function renderPeriod(){
  document.getElementById('mainContent').innerHTML=`<div class="fade-in"><div class="page-title">📅 经期记录</div><div class="card"><div class="card-title">📊 统计</div><div id="pdStats">加载中...</div></div><div class="card"><div class="card-title">🗓 日历</div><div id="pdCal">加载中...</div></div><div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span class="card-title" style="margin:0">📋 历史</span><button class="btn btn-primary btn-sm" onclick="showAddPeriod()">+ 记录</button></div><div id="pdList">加载中...</div></div></div>`;loadPeriod()}
async function loadPeriod(){
  const r=await fetch(API+'/api/period');const d=await r.json();
  const se=document.getElementById('pdStats');if(se)se.innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap"><div style="text-align:center;flex:1"><div style="font-size:24px;font-weight:700;color:var(--primary-dark)">${d.avgCycle}</div><div style="font-size:11px;color:var(--text-muted)">周期(天)</div></div><div style="text-align:center;flex:1"><div style="font-size:24px;font-weight:700;color:var(--primary-dark)">${d.avgDuration}</div><div style="font-size:11px;color:var(--text-muted)">持续(天)</div></div>${d.prediction?`<div style="text-align:center;flex:1"><div style="font-size:18px;font-weight:700;color:var(--warning)">📅 ${d.prediction.next_start}</div><div style="font-size:11px;color:var(--text-muted)">预测下次</div></div><div style="text-align:center;flex:1"><div style="font-size:18px;font-weight:700;color:var(--info)">🥚 ${d.prediction.ovulation_date}</div><div style="font-size:11px;color:var(--text-muted)">排卵期</div></div>`:'<div style="text-align:center;flex:1">暂无数据</div>'}</div>`;
  const ce=document.getElementById('pdCal');if(ce){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();const ps=new Set(),preS=new Set();let ov=null;d.records.forEach(r=>{if(r.start_date){const s=new Date(r.start_date),e=r.end_date?new Date(r.end_date):new Date(s);e.setDate(e.getDate()+d.avgDuration-1);for(let dd=new Date(s);dd<=e;dd.setDate(dd.getDate()+1))if(dd.getMonth()===m&&dd.getFullYear()===y)ps.add(dd.getDate())}});if(d.prediction){const ns=new Date(d.prediction.next_start);for(let i=0;i<d.avgDuration;i++){const pd=new Date(ns);pd.setDate(pd.getDate()+i);if(pd.getMonth()===m&&pd.getFullYear()===y)preS.add(pd.getDate())}const od=new Date(d.prediction.ovulation_date);if(od.getMonth()===m&&od.getFullYear()===y)ov=od.getDate()}let h='<div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:8px">';['日','一','二','三','四','五','六'].forEach(dd=>h+=`<div style="font-size:11px;color:var(--text-muted);padding:4px">${dd}</div>`);h+='</div><div class="period-grid">';for(let i=0;i<fd;i++)h+='<div></div>';for(let dd=1;dd<=dim;dd++){let c='period-day normal';if(dd===n.getDate())c+=' today';if(ps.has(dd))c='period-day period';else if(preS.has(dd))c='period-day predicted';else if(ov===dd)c='period-day ovulation';h+=`<div class="${c}">${dd}</div>`}h+='</div>';ce.innerHTML=h}
  const le=document.getElementById('pdList');if(le){if(d.records.length===0)le.innerHTML='<div class="empty-state"><div class="icon">📅</div><p>暂无记录</p></div>';else le.innerHTML='<table><tr><th>开始</th><th>结束</th><th>持续</th><th>症状</th><th>操作</th></tr>'+d.records.map(r=>{const dur=r.end_date?Math.round((new Date(r.end_date)-new Date(r.start_date))/86400000)+1:'-';return`<tr><td>${r.start_date}</td><td>${r.end_date||'进行中'}</td><td>${dur}天</td><td>${r.symptoms||'-'}</td><td><button class="btn btn-sm btn-outline" onclick="editPeriod(${r.id})">编辑</button> <button class="btn btn-sm btn-danger" onclick="delPeriod(${r.id})">删除</button></td></tr>`}).join('')+'</table>'}}
function showAddPeriod(){const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal"><div class="modal-title">记录经期</div><div class="form-row"><div class="form-group"><label>开始</label><input class="input" type="date" id="pStart" value="${today()}"></div><div class="form-group"><label>结束</label><input class="input" type="date" id="pEnd"></div></div><div class="form-group"><label>症状</label><input class="input" id="pSym"></div><div class="form-group"><label>心情</label><select class="select" id="pMood"><option value="">--</option><option value="😊 愉快">😊 愉快</option><option value="😐 一般">😐 一般</option><option value="😢 低落">😢 低落</option><option value="😡 烦躁">😡 烦躁</option></select></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary btn-sm" onclick="savePeriod()">保存</button></div></div>`;o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
async function savePeriod(){const d={start_date:document.getElementById('pStart').value,end_date:document.getElementById('pEnd').value,symptoms:document.getElementById('pSym').value,mood:document.getElementById('pMood').value};if(!d.start_date)return toast('请选择日期');await fetch(API+'/api/period',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('.modal-overlay')?.remove();loadPeriod()}
async function editPeriod(id){const r=await fetch(API+'/api/period');const d=await r.json();const rec=d.records.find(x=>x.id===id);if(!rec)return;const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal"><div class="modal-title">编辑记录</div><div class="form-row"><div class="form-group"><label>开始</label><input class="input" type="date" id="pStart" value="${rec.start_date}"></div><div class="form-group"><label>结束</label><input class="input" type="date" id="pEnd" value="${rec.end_date||''}"></div></div><div class="form-group"><label>症状</label><input class="input" id="pSym" value="${rec.symptoms||''}"></div><div class="form-group"><label>心情</label><select class="select" id="pMood"><option value="">--</option>${['😊 愉快','😐 一般','😢 低落','😡 烦躁'].map(m=>`<option value="${m}" ${rec.mood===m?'selected':''}>${m}</option>`).join('')}</select></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary btn-sm" onclick="saveEditPeriod(${id})">保存</button></div></div>`;o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
async function saveEditPeriod(id){const d={start_date:document.getElementById('pStart').value,end_date:document.getElementById('pEnd').value,symptoms:document.getElementById('pSym').value,mood:document.getElementById('pMood').value};await fetch(API+'/api/period/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('.modal-overlay')?.remove();loadPeriod()}
async function delPeriod(id){showConfirm('确定删除这条经期记录吗？',async()=>{await fetch(API+'/api/period/'+id,{method:'DELETE'});loadPeriod()})}

  document.getElementById('mainContent').innerHTML=`<div class="fade-in"><div class="page-title">💝 心情日记</div><div class="card"><div class="card-title">📝 今日心情</div><div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap" id="mdEmojis">${['😊','😄','😐','😢','😡','😴','🥰','😎','🤔','😰'].map(e=>`<button class="btn btn-outline btn-sm" style="font-size:20px;padding:8px 12px" onclick="selMood('${e}')">${e}</button>`).join('')}</div><div style="display:flex;gap:8px"><input class="input" id="mdNote" placeholder="写几句..."><button class="btn btn-primary" onclick="saveMood()">💾</button></div></div><div class="card"><div class="card-title">📅 心情月历</div><input type="month" class="input" style="width:auto;max-width:160px;margin-bottom:12px" id="mdMonth" value="${today().substring(0,7)}" onchange="loadMdCal()"><div id="mdCal">加载中...</div></div></div>`;loadMdCal()}
let sMood='😊';let shCatSel='全部';
function selMood(e){sMood=e;document.querySelectorAll('#mdEmojis button').forEach(b=>{b.classList.toggle('btn-primary',b.textContent===e);b.classList.toggle('btn-outline',b.textContent!==e)})}
async function saveMood(){await fetch(API+'/api/mood',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:today(),mood:sMood,note:document.getElementById('mdNote').value})});toast('已记录~');catAct('talk');loadMdCal()}
async function loadMdCal(){const mo=document.getElementById('mdMonth')?.value||today().substring(0,7);const r=await fetch(API+'/api/mood?month='+mo);const rs=await r.json();const mm={};rs.forEach(r=>{mm[r.date]=r});const el=document.getElementById('mdCal');if(!el)return;const[y,m]=mo.split('-').map(Number),fd=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();let h='<div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:8px">';['日','一','二','三','四','五','六'].forEach(d=>h+=`<div style="font-size:11px;color:var(--text-muted);padding:4px">${d}</div>`);h+='</div><div class="mood-grid">';for(let i=0;i<fd;i++)h+='<div></div>';for(let dd=1;dd<=dim;dd++){const dt=`${mo}-${String(dd).padStart(2,'0')}`,rec=mm[dt];h+=`<div class="mood-cell${dt===today()?' today':''}" title="${rec?rec.note||'':''}">${rec?rec.mood:''}</div>`}h+='</div>';el.innerHTML=h}

// ========== POMODORO ==========
let pInt,pSec=25*60,pRun=false,pBreak=false,pStartTime=0,pElapsed=0,pDuration=25*60;
function getPomoRemaining(){
  if(!pRun)return pSec;
  var now=Date.now(),remaining=Math.max(0,pDuration-pElapsed-Math.floor((now-pStartTime)/1000));
  return remaining
}
function updatePomoDisplay(s){
  var m=Math.floor(s/60),sec=s%60,d=document.getElementById('pDisp');
  if(d)d.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')
}
async function renderPomodoro(){
  var s=getPomoRemaining(),m=Math.floor(s/60),sec=s%60;let td={sessions:0,total_minutes:0};
  try{const r=await fetch(API+'/api/pomodoro?date='+today());td=await r.json()}catch(e){}
  document.getElementById('mainContent').innerHTML='<div class="fade-in"><div class="page-title">🍅 番茄专注</div><div class="card" style="text-align:center"><div class="timer-circle" style="border-color:'+(pBreak?'var(--success)':'var(--primary-light)')+'"><div><div class="timer-display" id="pDisp">'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'</div><div style="font-size:13px;color:var(--text-light)">'+(pBreak?'☕ 休息':'🍅 专注')+'</div></div></div><div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px"><button class="btn btn-primary" id="pBtn" onclick="togglePomo()">'+(pRun?'⏸ 暂停':'▶ 开始')+'</button><button class="btn btn-outline" onclick="resetPomo()">↺ 重置</button></div><div style="font-size:13px;color:var(--text-light)">今日: <b>'+td.sessions+'</b> 番茄 | <b>'+td.total_minutes+'</b> 分钟</div></div><div class="card"><div class="card-title">📊 历史统计</div><div id="pomoHist">加载中...</div></div><div class="card"><div class="card-title">🎵 白噪音</div><div class="sound-grid">'+["🔇 无","🌧 雨声","🔥 壁炉","🌊 海浪","🍃 森林","☕ 咖啡馆","🎹 钢琴"].map(s=>'<button class="sound-btn" onclick="selSound(this,\''+s+'\')">'+s+'</button>').join('')+'</div></div></div>';
  loadPomoHist();if(pRun){clearInterval(pInt);pInt=setInterval(pomoTick,500)}
}
function loadPomoHist(){
  var start=new Date();start.setDate(start.getDate()-30);var s=start.toISOString().split('T')[0];
  fetch(API+'/api/pomodoro/history?start='+s).then(function(r){return r.json()}).then(function(d){
    var el=document.getElementById('pomoHist');if(!el)return;
    if(d.records.length===0){el.innerHTML='<div style="text-align:center;color:var(--text-muted)">暂无历史记录</div>';return}
    var h='<div style="margin-bottom:8px;font-size:13px">总计：<b>'+d.total.s+'</b> 个番茄 | <b>'+d.total.m+'</b> 分钟</div>';
    h+='<div style="max-height:200px;overflow-y:auto">';
    d.records.slice(0,15).forEach(function(r){h+='<div style="padding:4px 0;font-size:12px;border-bottom:1px solid var(--border)">'+r.date+' ：🍅×'+r.sessions+' （'+r.minutes+'分钟）</div>'});
    h+='</div>';el.innerHTML=h
  })
}
function selSound(btn,s){document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function pomoTick(){var s=getPomoRemaining();pSec=s;updatePomoDisplay(s);if(s<=0){clearInterval(pInt);pRun=false;if(!pBreak){savePS();catAct('happy');spawnConfetti();toast('专注完成！🎉');pBreak=true;pDuration=5*60;pElapsed=0}else{pBreak=false;pDuration=25*60;pElapsed=0}pSec=pDuration;renderPomodoro()}}

// Note button drag
(function(){
  var btn=document.getElementById('noteFloatBtn'),dragging=false,sx,sy,ox,oy;
  btn.addEventListener('mousedown',function(e){
    if(e.button!==0)return;dragging=true;
    var r=btn.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;btn.style.left=(ox+e.clientX-sx)+'px';btn.style.top=(oy+e.clientY-sy)+'px';btn.style.right='auto';btn.style.bottom='auto';
  });
  document.addEventListener('mouseup',function(e){
    if(!dragging)return;dragging=false;
    if(Math.abs(e.clientX-sx)<5&&Math.abs(e.clientY-sy)<5)toggleNoteFloat();
  });
  btn.addEventListener('touchstart',function(e){dragging=true;var t=e.touches[0],r=btn.getBoundingClientRect();sx=t.clientX;sy=t.clientY;ox=r.left;oy=r.top});
  document.addEventListener('touchmove',function(e){if(!dragging)return;var t=e.touches[0];btn.style.left=(ox+t.clientX-sx)+'px';btn.style.top=(oy+t.clientY-sy)+'px';btn.style.right='auto';btn.style.bottom='auto'});
  document.addEventListener('touchend',function(){dragging=false});
})();

  if(ns.length===0){el.innerHTML='<div class="empty-state"><div class="icon">💡</div><p>'+(search?'没有匹配的灵感':'还没有灵感，点击上方按钮记录吧~')+'</p></div>';return}

    '<button class="btn btn-sm btn-outline" onclick="editNote('+n.id+','+JSON.stringify(n.content)+','+JSON.stringify(n.color||'#FFF9C4')+')">编辑</button>'+

function showNoteFloat(){
  document.getElementById('noteFloatPanel').classList.add('show');

}
async function pinNote(id,pinned){

function editNote(id,content,color){
  var o=document.createElement('div');o.className='modal-overlay';

async function saveEditNote(id){

async function delNote(id){

function swimSwitchTab(tab){
  swimTab=tab;
  document.querySelectorAll('.level-tab').forEach(function(b,i){
    var tabs=['pre','strokes','post'];
    b.classList.toggle('active',tabs[i]===tab);
  });
  if(tab==='strokes'){swimRenderStrokes();return}
  var endpoint=tab==='pre'?'/api/swim/pre-tips':'/api/swim/post-tips';
  fetch(API+endpoint).then(function(r){return r.json()}).then(function(items){
    var el=document.getElementById('swimContent');

    var addBtn='<button class="btn btn-sm btn-outline" onclick="swimAddTip(\''+(tab==='pre'?'pre':'post')+'\')" style="margin-bottom:12px">+ 添加注意事项</button>';
    el.innerHTML=addBtn+'<div id="swimTipList"></div>';
    swimRenderTipCards(items,tab);
  });
}

        '<span style="font-size:12px">◀</span><span>'+sec.title+'</span><span style="font-size:11px;color:var(--text-muted);margin-left:auto">展开/收起</span></div>'+
        '<div id="'+id+'" style="display:'+isOpen+';margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">'+steps+
        '<div style="margin-top:10px;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);line-height:1.6">'+
        '🎬 <strong>视频教程</strong>：在 B站 / 小红书 / 抖音 搜索 "<strong>'+sec.video+'</strong>"'+
        '<br><span style="font-size:11px">复制上方关键词到对应 App 搜索观看教学视频</span></div>'+
        '</div></div>';
    }).join('');
    return'<div class="card" style="margin-bottom:14px;border-left:4px solid var(--primary)">'+
      '<div class="card-title" style="cursor:pointer;font-size:18px;margin-bottom:0" onclick="var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'block\':\'none\'">'+
      stroke.icon+' '+stroke.name+'<span style="font-size:12px;color:var(--text-muted);margin-left:12px">'+(si===0?'默认展开':'点击展开')+'</span></div>'+
      '<div style="display:'+(si===0?'block':'none')+';padding-top:8px">'+sections+'</div></div>';
  }).join('');
  el.innerHTML=html;
}
